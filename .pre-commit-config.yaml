repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: sapsf-secret-check
        name: Reject credentials and scan for secrets (offline)
        entry: python .github/scripts/check_secrets.py
        language: python
        additional_dependencies: [detect-secrets==1.5.0]
        exclude: '(^|/)(node_modules|vendor|\.next|dist|dist-standalone|build)/'
